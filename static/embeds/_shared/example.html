<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Example embed</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: linear-gradient(135deg, #da212c, #8b0000);
        color: #fff;
        padding: 3rem 2rem;
      }
      .card {
        max-width: 640px;
        margin: 0 auto;
        text-align: center;
      }
      h1 { font-size: 2rem; margin: 0 0 0.5rem; }
      p { opacity: 0.9; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>This is a Claude design artifact</h1>
      <p>
        Paste the raw HTML you got from Claude design into a file under
        <code>static/embeds/&lt;topic&gt;/</code>, then embed it with
        <code>&lt;Embed src="embeds/&lt;topic&gt;/your-file.html" /&gt;</code>.
      </p>
    </div>
  </body>
</html>
